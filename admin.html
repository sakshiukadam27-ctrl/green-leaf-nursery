<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Orders - Green Leaf Nursery</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f8f2;
            color: #263528;
        }

        header {
            background: #2e7d32;
            color: white;
            padding: 24px 16px;
            text-align: center;
        }

        header h1 { margin: 0 0 8px; }

        nav {
            background: #1b3d25;
            padding: 13px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 12px;
        }

        main {
            max-width: 1100px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .panel {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 10px #0000000d;
        }

        h2 { color: #2e7d32; }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
        }

        .stat {
            background: #edf7e9;
            padding: 16px;
            border-radius: 9px;
            overflow-wrap: anywhere;
        }

        .stat p { margin: 0 0 8px; }
        .stat strong { font-size: 22px; color: #246b2c; }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        input {
            flex: 1;
            min-width: 180px;
            padding: 12px;
            border: 1px solid #b8c8b7;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            background: #2e7d32;
            color: white;
            border: none;
            padding: 12px 17px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        .order-card {
            border: 1px solid #d5e4d3;
            border-radius: 10px;
            padding: 18px;
            margin: 15px 0;
            overflow-wrap: anywhere;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            gap: 12px;
            flex-wrap: wrap;
            border-bottom: 1px solid #e5eee3;
            padding-bottom: 12px;
        }

        .order-header h3 {
            margin: 0 0 6px;
            color: #246b2c;
        }

        .order-details p {
            line-height: 1.5;
            margin: 9px 0;
        }

        .badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            background: #e4f3df;
            color: #245e2a;
            font-size: 13px;
            font-weight: bold;
        }

        .items-box {
            background: #f7faf6;
            border-radius: 7px;
            padding: 12px;
            line-height: 1.7;
        }

        .order-total {
            color: #246b2c;
            font-weight: bold;
            font-size: 20px;
        }

        .message {
            padding: 13px;
            border-radius: 7px;
            background: #f5f5f5;
            overflow-wrap: anywhere;
        }

        .error {
            background: #ffebee;
            color: #a11b1b;
        }

        .empty { text-align: center; padding: 25px; }

        @media (max-width: 600px) {
            .summary { grid-template-columns: 1fr; }
            .panel { padding: 15px; }
            nav a { display: inline-block; margin: 6px; }
        }
    </style>
</head>

<body>

<header>
    <h1>🌱 Green Leaf Nursery</h1>
    <p>Admin Orders Dashboard</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="plants.html">Plants</a>
    <a href="order.html">View Cart</a>
</nav>

<main>
    <section class="panel">
        <h2>📊 Orders Summary</h2>

        <div class="summary">
            <div class="stat">
                <p>Total Orders</p>
                <strong id="order-count">0</strong>
            </div>

            <div class="stat">
                <p>Total Order Value</p>
                <strong id="order-value">₹0.00</strong>
            </div>

            <div class="stat">
                <p>UPI Orders</p>
                <strong id="upi-count">0</strong>
            </div>
        </div>
    </section>

    <section class="panel">
        <h2>📦 Customer Orders</h2>

        <div class="controls">
            <input
                type="search"
                id="search"
                placeholder="Search name, email or order ID..."
                aria-label="Search orders"
            >

            <button type="button" id="refresh-button">
                ↻ Refresh Orders
            </button>
        </div>

        <p id="status" class="message" role="status"
           aria-live="polite">Loading orders...</p>

        <div id="orders-list"></div>
    </section>
</main>

<script>
    const API_URL = "http://localhost:5000/api/orders";

    let allOrders = [];

    const ordersList = document.getElementById("orders-list");
    const statusElement = document.getElementById("status");
    const refreshButton = document.getElementById("refresh-button");
    const searchInput = document.getElementById("search");

    function money(value) {
        const amount = Number(value);
        return "₹" + (Number.isFinite(amount) ? amount : 0).toFixed(2);
    }

    function addText(parent, tag, text, className) {
        const element = document.createElement(tag);
        element.textContent = text ?? "";

        if (className) element.className = className;

        parent.appendChild(element);
        return element;
    }

    function getItems(order) {
        try {
            const items = typeof order.items === "string"
                ? JSON.parse(order.items)
                : order.items;

            return Array.isArray(items) ? items : [];
        } catch {
            return [];
        }
    }

    function getDate(order) {
        if (!order.createdAt) return "Date not available";

        const date = new Date(
            String(order.createdAt).replace(" ", "T") + "Z"
        );

        return Number.isNaN(date.getTime())
            ? String(order.createdAt)
            : date.toLocaleString();
    }

    function renderOrders() {
        const term = searchInput.value.trim().toLowerCase();

        const filtered = allOrders.filter(order => {
            const searchable = [
                order.id,
                order.customerName,
                order.email,
                order.address,
                order.paymentMethod
            ].join(" ").toLowerCase();

            return searchable.includes(term);
        });

        ordersList.replaceChildren();

        if (filtered.length === 0) {
            addText(
                ordersList,
                "p",
                allOrders.length === 0
                    ? "No orders have been placed yet."
                    : "No orders match your search.",
                "empty"
            );
            return;
        }

        filtered.forEach(order => {
            const card = document.createElement("article");
            card.className = "order-card";

            const heading = document.createElement("div");
            heading.className = "order-header";

            const titleGroup = document.createElement("div");
            addText(titleGroup, "h3", "Order #" + order.id);
            addText(titleGroup, "p", getDate(order));

            const payment = String(order.paymentMethod || "COD").toUpperCase();
            addText(
                heading,
                "span",
                payment,
                "badge"
            );

            heading.prepend(titleGroup);
            card.appendChild(heading);

            const details = document.createElement("div");
            details.className = "order-details";

            addText(details, "p", "Customer: " + (order.customerName || "N/A"));
            addText(details, "p", "Email: " + (order.email || "N/A"));
            addText(details, "p", "Delivery address: " + (order.address || "N/A"));

            addText(details, "h4", "Plants Ordered");

            const itemsBox = document.createElement("div");
            itemsBox.className = "items-box";

            const items = getItems(order);

            if (items.length === 0) {
                addText(itemsBox, "p", "Item details unavailable.");
            } else {
                items.forEach(item => {
                    const name = item.name || "Plant";
                    const quantity = Number(item.quantity) || 0;
                    const price = Number(item.price) || 0;

                    addText(
                        itemsBox,
                        "div",
                        name + " × " + quantity +
                        " — " + money(price * quantity)
                    );
                });
            }

            details.appendChild(itemsBox);

            addText(details, "p", "Payment method: " + payment);

            if (payment === "UPI") {
                addText(
                    details,
                    "p",
                    "Payment verification: Check the transaction separately."
                );
            } else {
                addText(
                    details,
                    "p",
                    "Payment collection: Cash on Delivery selected."
                );
            }

            addText(
                details,
                "p",
                "Order total: " + money(order.total),
                "order-total"
            );

            card.appendChild(details);
            ordersList.appendChild(card);
        });
    }

    async function loadOrders() {
        refreshButton.disabled = true;
        statusElement.className = "message";
        statusElement.textContent = "Loading orders...";

        try {
            const response = await fetch(API_URL);

            if (!response.ok) {
                throw new Error("Could not load orders from the server.");
            }

            const data = await response.json();

            if (!Array.isArray(data)) {
                throw new Error("Unexpected response from the server.");
            }

            allOrders = data;

            document.getElementById("order-count").textContent =
                allOrders.length;

            const totalValue = allOrders.reduce((sum, order) => {
                const total = Number(order.total);
                return sum + (Number.isFinite(total) ? total : 0);
            }, 0);

            document.getElementById("order-value").textContent =
                money(totalValue);

            document.getElementById("upi-count").textContent =
                allOrders.filter(order =>
                    String(order.paymentMethod || "").toUpperCase() === "UPI"
                ).length;

            statusElement.textContent =
                "Orders loaded successfully: " + allOrders.length;

            renderOrders();

        } catch (error) {
            console.error(error);

            statusElement.className = "message error";
            statusElement.textContent =
                "Orders load hot nahit. Backend chalu aahe ka check kar. " +
                "Error: " + error.message;

            ordersList.replaceChildren();

        } finally {
            refreshButton.disabled = false;
        }
    }

    refreshButton.addEventListener("click", loadOrders);
    searchInput.addEventListener("input", renderOrders);

    loadOrders();
</script>

</body>
</html>
